<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الفواتير">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>متابعة الفواتير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#efede7; --text:#1d1c1a; --muted:#6c6963; --line:#e2dfd7;
  --accent:#0f6b57; --accent-2:#0b5545; --accent-ink:#ffffff; --accent-soft:#e3f1ec;
  --danger:#b3261e; --ok:#1d7a3e; --warn:#a86400;
  --c-notdue:#5f6b7a; --c-m1:#9a7300; --c-m3:#b85f00; --c-m6:#c8461a; --c-y1:#bf2f2a; --c-y2:#a11d33; --c-y2p:#7c1236; --c-nodate:#7a6f62; --c-paid:#1d7a3e;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1d1c1a; --surface-2:#282724; --text:#ecebe6; --muted:#a19e96; --line:#34322e;
    --accent:#43b596; --accent-2:#5cc7a8; --accent-ink:#0c1a16; --accent-soft:#16302a;
    --danger:#f0776f; --ok:#5bc77e; --warn:#e3a54a;
    --c-notdue:#9aa6b6; --c-m1:#e0bb4a; --c-m3:#f0a052; --c-m6:#f4865c; --c-y1:#f37068; --c-y2:#ee6a86; --c-y2p:#e070a0; --c-nodate:#b8ab9b; --c-paid:#5bc77e;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1d1c1a; --surface-2:#282724; --text:#ecebe6; --muted:#a19e96; --line:#34322e;
  --accent:#43b596; --accent-2:#5cc7a8; --accent-ink:#0c1a16; --accent-soft:#16302a;
  --danger:#f0776f; --ok:#5bc77e; --warn:#e3a54a;
  --c-notdue:#9aa6b6; --c-m1:#e0bb4a; --c-m3:#f0a052; --c-m6:#f4865c; --c-y1:#f37068; --c-y2:#ee6a86; --c-y2p:#e070a0; --c-nodate:#b8ab9b; --c-paid:#5bc77e;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.num,.money{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:progress}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;outline:none}
textarea{min-height:80px;resize:vertical}
[aria-invalid="true"]{border-color:var(--danger)!important}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.login{width:100%;max-width:380px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;font-weight:700}
.login p{margin:0;color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px;min-height:1em}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text)}

/* header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.brand h1{font-size:17px}
.brand p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .email{font-size:13px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.role{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.demo{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--text);border-bottom:1px solid var(--line);font-size:13.5px}
.demo .wrap{padding-top:8px;padding-bottom:8px}

main{padding:16px 0 60px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:820px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:14px 14px 12px}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .val{font-size:22px;font-weight:700;margin-top:2px;line-height:1.2}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.alert .val{color:var(--c-y1)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:18px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:none;background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.dot-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;margin-inline-start:4px}
.note-box.new-banner{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.new-banner::before{content:none}
.log-item.new{background:var(--accent-soft);border-radius:10px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}

/* toolbar */
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toolbar .q{grid-column:1/-1}
.toolbar .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.toolbar .actions .btn{flex:1 1 auto}
.toolbar #fSort{grid-column:1/-1}
.toolbar select{min-width:0}
@media (min-width:820px){
  .toolbar{grid-template-columns:repeat(3,minmax(0,1fr));}
  .toolbar .q,.toolbar #fSort{grid-column:auto}
  .toolbar .actions .btn{flex:0 0 auto}
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.chip{--c:var(--muted);flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13.5px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600}
.chip-amt{color:var(--muted);font-size:12px}
.sig{text-align:center;font-size:13px;color:var(--muted);margin:24px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.sum-card{padding:14px;margin-bottom:12px}
.sum-card h3{font-size:15px;margin-bottom:10px}
.bar.big{height:12px}
.mbars{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.mrow .ml{color:var(--muted)}
.mrow .mt{display:flex;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.mrow .mt i{display:block;background:var(--accent);border-radius:99px}
.mrow .mv{min-width:70px;text-align:end}
.badge.fol{--c:var(--c-notdue)} .badge.fol-promise{--c:var(--accent)} .badge.fol-noanswer,.badge.fol-refused{--c:var(--warn)} .badge.fol-hopeless{--c:var(--muted)} .badge.hold{--c:var(--danger)}
.note-box.hold{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));font-weight:600}
.note-box.hold::before,.note-box.hold div::before{content:none}
.fuform{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.fuform .full{grid-column:1/-1}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.count{font-size:13px;color:var(--muted);margin:8px 2px}

/* invoice list */
.list{display:flex;flex-direction:column;gap:8px}
.inv{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.inv:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.inv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.inv .name{font-weight:600;font-size:15.5px}
.inv .meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
.inv-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.inv-nums small{display:block;font-size:11.5px;color:var(--muted)}
.inv-nums span{font-size:14px;font-weight:500}
.inv-nums .rem{font-weight:700}
@media (min-width:820px){
  .inv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.7fr);gap:16px;align-items:center}
  .inv-nums{margin-top:0;padding-top:0;border-top:0}
}
.badge{--c:var(--muted);flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.st-unpaid{--c:var(--c-y1)} .st-partial{--c:var(--warn)} .st-paid{--c:var(--ok)}
.cat-new{--c:var(--c-notdue)} .cat-late{--c:var(--c-m1)} .cat-m3{--c:var(--c-m3)} .cat-m6{--c:var(--c-m6)} .cat-y1{--c:var(--c-y1)} .cat-y2{--c:var(--c-y2)} .cat-y5,.cat-y10,.cat-y15{--c:var(--c-y2p)} .cat-nodate,.cat-noamount{--c:var(--c-nodate)} .cat-refund{--c:var(--accent)} .cat-paid{--c:var(--c-paid)}
.st-refund{--c:var(--accent)} .st-noamount{--c:var(--c-nodate)}
.contact{display:flex;gap:6px;flex-wrap:wrap}
.badge.kind{--c:var(--muted)} .badge.warn{--c:var(--warn)}
.note-box{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.note-box.alert{background:color-mix(in srgb,var(--warn) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.note-box.info{background:var(--accent-soft)}
.note-box div::before{content:"• ";opacity:.6}
.who-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.who-row:last-child{border-bottom:0}
.who-row .k{font-size:12.5px;color:var(--muted)}
.who-row .v{font-weight:500}
.who-row .num,.who-row .v{align-self:flex-start}
a.btn{text-decoration:none}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px}
.crow .full{grid-column:1/-1}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.more{display:flex;justify-content:center;margin-top:12px}

/* log */
.log{display:flex;flex-direction:column}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.log-item .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--surface-2);grid-row:span 2}
.log-item .tx{font-size:14.5px}
.log-item .by{font-size:12.5px;color:var(--muted)}
.log-day{font-size:12.5px;font-weight:600;color:var(--muted);padding:14px 4px 4px}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);border-radius:18px;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,10,10,.45)}
@media (max-width:640px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}}
.dlg{display:flex;flex-direction:column;max-height:inherit;height:100%}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:18px}
.dlg-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.dlg-body{padding:16px 18px 28px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.x{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
.money3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money3 > div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.money3 small{display:block;font-size:12px;color:var(--muted)}
.money3 b{font-size:17px}
.bar{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sec h3{font-size:15px;margin-bottom:8px}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--accent-soft);padding:12px;border-radius:12px}
.payform .full{grid-column:1/-1}
.payform .row{display:flex;gap:8px;align-items:end}
.pays{display:flex;flex-direction:column;gap:6px}
.pay{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pay .l{min-width:0}
.pay .a{font-weight:600}
.pay .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
details.admin{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.admin summary{cursor:pointer;padding:12px 0;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:12px}
.grid2 .full{grid-column:1/-1}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.prev{width:100%;border-collapse:collapse;font-size:13px}
.prev th,.prev td{border-bottom:1px solid var(--line);padding:6px;text-align:start;white-space:nowrap}
.prev-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.stats{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.stats li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:20px;display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast div.bad{background:var(--danger);color:#fff}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:r 0.8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin" aria-label="جاري التحميل"></div></div></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { firebaseConfig, APP_TITLE, ORG_NAME } from './config.js';

const DEMO = !firebaseConfig?.apiKey || /^PASTE/i.test(firebaseConfig.apiKey);
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const CUR = 'ر.س';
document.title = APP_TITLE || 'متابعة الفواتير';

/* =================== helpers =================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round((+n || 0) * 100) / 100;
const toLatin = s => String(s ?? '')
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/٫/g, '.').replace(/٬/g, ',');
const num = v => {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const s = toLatin(v).replace(/[^\d.\-]/g, '');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const money = n => round2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const M = n => n === null || n === undefined ? '—' : `<span class="money">${money(n)}</span>`;
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const daysBetween = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
const fmtDate = s => s ? `<span class="num">${esc(s.split('-').reverse().join('/'))}</span>` : '—';
const fmtDateTime = d => d ? `<span class="num">${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}</span>` : '';

const KINDS = [

function insights(inv, known, remaining, paid) {

  const badPhone = !cPhone && /^[+\d\s-]{6,}$/.test(toLatin(cno));
  if (badPhone) alerts.push(`رقم الجوال المسجل غير صحيح (${cno})`);

  // Other text instead of a number (e.g. the customer's shop name): if it's a known contact, ask them;
  // otherwise the number is with the person responsible for the invoice.
  if (!askName && cno && !cPhone && !badPhone && !/لا\s*يوجد|الملاحظات/.test(cno))

  const kinds = KINDS.filter(k => k.re.test(no));

  kinds.forEach(k => { if (k.alert) { alerts.push(k.info); review = true; } else infos.push(k.info); });

  if (!known) { alerts.push('المبلغ غير معروف'); if (!prep) review = true; }

/* =================== data layer: Firebase =================== */
async function firebaseApi() {
  const [appM, authM, fs] = await Promise.all([
    import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(firebaseConfig);
  const auth = authM.getAuth(app);
  const db = fs.getFirestore(app);
  const ref = id => fs.doc(db, 'invoices', id);
  const stamp = () => ({ updatedAt: fs.serverTimestamp(), updatedBy: auth.currentUser?.email || '' });
  const err = (code, msg) => Object.assign(new Error(msg || code), { code });
  return {
    onAuth: cb => authM.onAuthStateChanged(auth, u => cb(u ? { email: u.email } : null)),
    signIn: (e, p) => authM.signInWithEmailAndPassword(auth, e.trim(), p),
    signOut: () => authM.signOut(auth),
    resetPassword: e => authM.sendPasswordResetEmail(auth, e.trim()),
    async getRole(email) {
      const s = await fs.getDoc(fs.doc(db, 'roles', String(email).toLowerCase()));
      return s.exists() ? (s.data().role || null) : null;
    },
    watchInvoices: (cb, onErr) => fs.onSnapshot(fs.collection(db, 'invoices'),
      s => cb(s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }))), onErr),
    watchLog: (cb, onErr) => fs.onSnapshot(fs.query(fs.collection(db, 'log'), fs.orderBy('at', 'desc'), fs.limit(200)),
      s => cb(s.docs.map(d => { const x = d.data({ serverTimestamps: 'estimate' }); return { id: d.id, ...x, at: toDateLike(x.at) || new Date() }; })), onErr),
    addPayment: (id, entry) => fs.runTransaction(db, async t => {
      const s = await t.get(ref(id)); if (!s.exists()) throw err('not-found');
      const d = s.data(); const rem = round2(num(d.amount) - num(d.paid));
      if (entry.amount > rem + 0.004) throw err('app/over');
      t.update(ref(id), { paid: round2(num(d.paid) + entry.amount), payments: [...(d.payments || []), entry], ...stamp() });
    }),
    removePayment: (id, pid) => fs.runTransaction(db, async t => {
      const s = await t.get(ref(id)); if (!s.exists()) throw err('not-found');
      const d = s.data(); const p = (d.payments || []).find(x => x.id === pid); if (!p) return 0;
      t.update(ref(id), { payments: d.payments.filter(x => x.id !== pid), paid: round2(num(d.paid) - num(p.amount)), ...stamp() });
      return p.amount;
    }),
    update: (id, fields) => fs.updateDoc(ref(id), { ...fields, ...stamp() }),
    remove: id => fs.deleteDoc(ref(id)),
    async createMany(docs) {
      for (let i = 0; i < docs.length; i += 400) {
        const b = fs.writeBatch(db);
        docs.slice(i, i + 400).forEach(({ id, ...rest }) => b.set(ref(id), { ...rest, createdAt: fs.serverTimestamp(), ...stamp() }));
        await b.commit();
      }
    },
    addLog: e => fs.addDoc(fs.collection(db, 'log'), { ...e, at: fs.serverTimestamp() }),
    watchContacts: (cb, onErr) => fs.onSnapshot(fs.doc(db, 'settings', 'contacts'), s => cb(s.exists() ? (s.data().list || []) : []), onErr),
    saveContacts: list => fs.setDoc(fs.doc(db, 'settings', 'contacts'), { list, ...stamp() }),
    watchBackup: (cb, onErr) => fs.onSnapshot(fs.doc(db, 'settings', 'backup'), s => cb(s.exists() ? s.data() : {}), onErr),
    saveBackup: d => fs.setDoc(fs.doc(db, 'settings', 'backup'), d, { merge: true }),
  };
}

    async saveBackup(d) { Object.assign(backup, d); bakSubs.forEach(f => f({ ...backup })); },
  };
}

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.innerHTML = '', bad ? 5000 : 2600);

function errMsg(e) {
  const c = e?.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'البريد أو كلمة المرور غير صحيحة';
  if (/too-many-requests/.test(c)) return 'محاولات كثيرة، حاول بعد شوي';
  if (/api-key/.test(c)) return 'مفتاح Firebase في ملف config.js غير صحيح (apiKey) — راجعه';
  if (/unauthorized-domain/.test(c)) return 'رابط الموقع مو مضاف في Firebase ← Authentication ← Settings ← Authorized domains';
  if (/operation-not-allowed/.test(c)) return 'تسجيل الدخول بالبريد مو مفعّل في Firebase ← Authentication ← Email/Password';
  if (/network/.test(c)) return 'تحقق من اتصال الإنترنت';
  if (/permission-denied/.test(c)) return 'ما عندك صلاحية لهذا الإجراء';
  if (c === 'app/over') return 'المبلغ أكبر من المتبقي على الفاتورة';
  if (c === 'not-found') return 'الفاتورة غير موجودة (ممكن انحذفت)';
  return 'صار خطأ: ' + (e?.message || c || 'غير معروف');
}

function matches(x, skipCat = false) {
  const f = S.f;
  if (f.status === 'open' && x.status === 'paid') return false;
  if (f.status === 'review' && !x.ins.review) return false;
  if (f.status === 'old' && !x.oldFile) return false;
  if (f.status === 'hold' && !x.hold) return false;
  if (!['open', 'all', 'review', 'old', 'hold'].includes(f.status) && x.status !== f.status) return false;
  if (f.follow === 'due' ? !x.promiseDue : (f.follow && x.follow !== f.follow)) return false;
  if (f.size) { const [lo, hi] = SIZES[f.size]; if (!(x.remaining >= lo && x.remaining < hi) || x.amount === null) return false; }
  if (f.owner === '__none' ? !!x.owner : (f.owner && x.owner !== f.owner)) return false;
  if (!skipCat && f.cat && x.cat !== f.cat) return false;
  if (f.q) {
    const q = normAr(f.q);
    if (!normAr([x.name, x.displayName, x.invoiceNo, x.customerNo, x.owner, x.notes, x.ins.ask?.name, ...x.ins.phones, ...x.ins.kinds.map(k => k.label), FOL[x.follow].label, x.oldFile ? 'الملف القديم' : '', x.hold || ''].join(' ')).includes(q)) return false;
  }
  return true;
}
const SORTS = {
  days: (a, b) => b.days - a.days || b.remaining - a.remaining,
  remaining: (a, b) => b.remaining - a.remaining,
  due: (a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'),
  name: (a, b) => (a.displayName || '').localeCompare(b.displayName || '', 'ar'),
};

function update() {
  if (!$('#kpis')) return;
  renderKpis();
  renderBackupBanner();
  if (S.view === 'log') { renderLog(); return; }
  if (S.view === 'cust') { renderCustomers(); return; }
  if (S.view === 'sum') { renderSummary(); return; }

  // owners
  const owners = [...new Set(S.invoices.map(x => x.owner).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
  const hasNone = S.invoices.some(x => !x.owner);
  if (S.f.owner && S.f.owner !== '__none' && !owners.includes(S.f.owner)) S.f.owner = '';
  $('#fOwner').innerHTML = `<option value="">كل المسؤولين</option>` + owners.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('') + (hasNone ? `<option value="__none">بدون مسؤول</option>` : '');
  $('#fOwner').value = S.f.owner;

  // chips
  const base = S.invoices.filter(x => matches(x, true));
  const byCat = {}; base.forEach(x => { (byCat[x.cat] ||= { n: 0, s: 0 }); byCat[x.cat].n++; byCat[x.cat].s += x.remaining; });
  $('#chips').innerHTML = CATS.filter(c => byCat[c.k]).map(c => `
    <button class="chip cat-${c.k}" data-cat="${c.k}" aria-pressed="${S.f.cat === c.k}"><span class="dot"></span>${c.label} <b class="num">${byCat[c.k].n}</b>${byCat[c.k].s > 0 ? `<small class="chip-amt">${shortMoney(byCat[c.k].s)}</small>` : ''}</button>`).join('');
  // promises that are due
  const due = S.invoices.filter(x => x.promiseDue);
  const pb = $('#promiseBanner'); pb.hidden = !due.length || S.f.follow === 'due';
  if (due.length) pb.innerHTML = `<span>فيه <b class="num">${due.length}</b> ${due.length === 1 ? 'وعد سداد حلّ موعده' : 'وعود سداد حلّ موعدها'} — تابعها اليوم</span><button class="btn sm" id="seeDue">عرضها</button>`;
  $('#seeDue')?.addEventListener('click', () => { S.f.follow = 'due'; S.f.status = 'all'; $('#fFollow').value = 'due'; $('#fStatus').value = 'all'; update(); });

  // list
  const rows = base.filter(x => !S.f.cat || x.cat === S.f.cat).sort(SORTS[S.f.sort] || SORTS.days);
  const sumRem = rows.reduce((s, x) => s + Math.max(0, x.remaining), 0);
  $('#count').innerHTML = S.loaded ? `عرض <span class="num">${Math.min(rows.length, S.limit)}</span> من <span class="num">${rows.length}</span> فاتورة · المتبقي ${M(sumRem)} ${CUR}` : '';
  if (!S.loaded) { $('#list').innerHTML = `<div class="empty"><div class="spin" style="margin:auto"></div></div>`; return; }
  if (!S.invoices.length) {
    $('#list').innerHTML = `<div class="empty">ما فيه فواتير للحين.${isAdmin() ? `<br><button class="btn primary" id="imp2">⬆︎ استيراد ملف Excel</button>` : '<br>المالك يرفع ملف الفواتير.'}</div>`;
    $('#imp2')?.addEventListener('click', () => $('#file').click());
    $('#more').innerHTML = ''; return;
  }
  if (!rows.length) { $('#list').innerHTML = `<div class="empty">ما فيه فواتير تطابق البحث أو الفلاتر.</div>`; $('#more').innerHTML = ''; return; }
  $('#list').innerHTML = rows.slice(0, S.limit).map(card).join('');
  $('#more').innerHTML = rows.length > S.limit ? `<button class="btn">عرض المزيد</button>` : '';
}

function renderKpis() {

  const sum = a => a.reduce((s, x) => s + x.remaining, 0);

function getSeen() { try { return +localStorage.getItem(seenKey()) || 0; } catch { return S.seenFallback || 0; } }
function setSeen(t) { S.seenFallback = t; try { localStorage.setItem(seenKey(), String(t)); } catch {} }
const isNewForMe = (l, seen) => l.by !== S.user.email && l.at && l.at.getTime() > seen;
function renderUnread() {
  if (!$('#logBadge')) return;
  const n = S.view === 'log' ? 0 : S.log.filter(l => isNewForMe(l, getSeen())).length;
  $('#logBadge').hidden = !n; $('#logBadge').textContent = n;
  const b = $('#newBanner'); b.hidden = !n;
  if (n) b.innerHTML = `<span>فيه <b class="num">${n}</b> ${n === 1 ? 'تحديث جديد' : 'تحديثات جديدة'} من آخر مرة شفت السجل</span><button class="btn sm" id="seeNew">عرضها</button>`;
  $('#seeNew')?.addEventListener('click', () => $('.tabs button[data-view="log"]').click());
  document.title = (n ? `(${n}) ` : '') + (APP_TITLE || 'متابعة الفواتير');
}

function renderLog() {
  const seen = S.prevSeen ?? getSeen();
  const icons = { payment: '💵', undo: '↩︎', note: '📝', edit: '✏️', delete: '🗑', import: '⬆︎', create: '＋', follow: '☎︎', export: '⬇︎' };
  if (!S.log.length) { $('#logView').innerHTML = `<div class="empty">ما فيه تحديثات للحين. أي دفعة أو تعديل يتسجّل هنا بالاسم والوقت.</div>`; return; }
  let html = '', lastDay = '';
  S.log.forEach(l => {
    const d = l.at, day = d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : '';
    if (day !== lastDay) { html += `<div class="log-day num">${day}</div>`; lastDay = day; }
    html += `<div class="log-item${isNewForMe(l, seen) ? ' new' : ''}"><div class="ic" aria-hidden="true">${icons[l.type] || '•'}</div>
      <div class="tx">${esc(l.text)}</div><div class="by">${shortUser(l.by)} · <span class="num">${d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''}</span></div></div>`;
  });
  $('#logView').innerHTML = `<div class="log">${html}</div>`;
  setSeen(Date.now()); renderUnread();
}

function callBtns(phone, msg = '') {
  const i = intlPhone(phone);
  return `<div class="contact"><a class="btn sm" href="tel:+${i}">📞 اتصال</a><a class="btn sm" href="https://wa.me/${i}${msg ? '?text=' + encodeURIComponent(msg) : ''}" target="_blank" rel="noopener">واتساب</a></div>`;
}
function contactSection(x) {
  const I = x.ins, rows = [];
  const cno = String(x.customerNo ?? '').trim();
  if (x.hold) {
    rows.push(`<div class="who-row"><span class="k">جوال العميل</span><span class="v">موقوف التواصل مع الزبون</span>${I.phones.length ? `<span class="muted num">${I.phones.join(' / ')}</span>` : ''}</div>`);
  } else if (I.phones.length) {
    rows.push(`<div class="who-row"><span class="k">جوال العميل${I.phones.length > 1 ? ` (${I.phones.length} أرقام)` : ''}</span>${I.phones.map(p => `<span class="v num">${p}</span>${callBtns(p)}`).join('')}</div>`);
  } else {
    rows.push(`<div class="who-row"><span class="k">جوال العميل</span><span class="v">الرقم غير موجود</span>${cno ? `<span class="muted">مكتوب في الملف: ${esc(cno)}</span>` : ''}</div>`);
  }
  const sameAsOwner = I.ask && x.owner && normAr(I.ask.name) === normAr(findContact(x.owner)?.name || x.owner);
  if (I.ask && !x.hold) {
    const amt = x.amount !== null ? ` بمبلغ ${money(x.amount)} ريال` : '';
    const msg = `السلام عليكم، الفاتورة رقم ${x.invoiceNo} بتاريخ ${x.invoiceDate || ''}${amt} مسجلة عندك. تعرف اسم العميل ورقم جواله؟`;
    rows.push(`<div class="who-row"><span class="k">${sameAsOwner ? 'المسؤول — اسأله عن رقم العميل' : 'اسأل عن رقم العميل'}</span><span class="v">${esc(I.ask.name)}${I.ask.phone ? ` · <span class="num">${I.ask.phone}</span>` : ''}</span>${I.ask.phone ? callBtns(I.ask.phone, msg) : `<span class="muted">${isAdmin() ? 'رقمه مو مضاف — أضفه من «جهات التواصل»' : 'رقمه مو مضاف'}</span>`}</div>`);
  }
  if (x.owner && !sameAsOwner) {
    const c = findContact(x.owner);
    rows.push(`<div class="who-row"><span class="k">المسؤول</span><span class="v">${esc(x.owner)}${/المؤسس/.test(x.owner) ? ' <span class="muted">(تتحملها المؤسسة)</span>' : ''}${c?.phone ? ` · <span class="num">${c.phone}</span>` : ''}</span>${c?.phone ? callBtns(c.phone) : ''}</div>`);
  }
  return `<div class="sec"><h3>التواصل</h3><div>${rows.join('')}</div></div>`;

  $('#d-pays').innerHTML = (pays.length ? `<div class="pays">${pays.map(p => `

    + (!pays.length && !(before > 0.004) ? `<p class="muted" style="margin:0">ما فيه دفعات.</p>` : '');
  $$('#d-pays [data-undo]').forEach(b => b.onclick = () => {
    const c = cur(); const p = c.payments.find(q => q.id === b.dataset.undo);

  });
  const pb = $('#payForm'); if (pb) pb.hidden = x.remaining <= 0;
}

async function submitPayment() {
  const x = cur(); if (!x) return;
  const amt = round2(num($('#p-amt').value)), date = $('#p-date').value || todayISO(), note = $('#p-note').value.trim();
  if (!(amt > 0)) { toast('اكتب مبلغ صحيح', true); $('#p-amt').focus(); return; }
  if (amt > x.remaining + 0.004) { toast(`المبلغ أكبر من المتبقي (${money(x.remaining)})`, true); return; }
  if (!confirm(`تسجيل دفعة ${money(amt)} ${CUR} لفاتورة ${x.invoiceNo} (${x.name})؟`)) return;
  const entry = { id: uid(), amount: amt, date, note, by: S.user.email, at: Date.now() };
  await busy($('#p-btn'), async () => {
    await S.api.addPayment(x.id, entry);
    logIt('payment', x, `سداد ${money(amt)} ${CUR} — فاتورة ${x.invoiceNo} (${x.name})${note ? ' · ' + note : ''}`, amt);
    toast('تم تسجيل الدفعة'); $('#p-amt').value = ''; $('#p-note').value = ''; $('#p-date').value = todayISO();
  });
}

    <div class="field"><label>مبلغ الفاتورة *</label><input id="f-amount" type="text" inputmode="decimal" dir="ltr" value="${x.amount ?? ''}"></div>
    <div class="field"><label>تاريخ الفاتورة *</label><input id="f-invoiceDate" type="date" value="${v('invoiceDate')}"></div>
    <div class="field"><label>تاريخ الاستحقاق</label><input id="f-dueDate" type="date" value="${v('dueDate')}"></div>

    ${!isNew && isAdmin() ? `<div class="field full"><label>تنبيه «لا تتواصل مع الزبون» (اتركه فاضي إذا ما فيه)</label><input id="f-hold" type="text" value="${v('hold')}" placeholder="مثلاً: موضوعها عند أسامة — لا تكلم الزبون"></div>
    <label class="full" style="display:flex;gap:8px;align-items:center"><input id="f-old" type="checkbox" ${x.oldFile ? 'checked' : ''}> من الملف القديم</label>` : ''}
    ${isNew ? `<div class="field full"><label>المبلغ المسدد مسبقاً</label><input id="f-paid" type="text" inputmode="decimal" dir="ltr" value="0"></div>
    <div class="field full"><label>ملاحظات</label><textarea id="f-notes"></textarea></div>` : ''}
  </div>`;
}
function readInvoiceForm() {
  const g = id => $('#f-' + id)?.value?.trim() ?? '';
  const f = { invoiceNo: g('invoiceNo'), name: g('name'), customerNo: g('customerNo'), amount: round2(num(g('amount'))),
    invoiceDate: g('invoiceDate'), dueDate: g('dueDate'), owner: g('owner') };
  const bad = (id, msg) => { toast(msg, true); const el = $('#f-' + id); if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); } return null; };
  $$('#invForm [aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  if ($('#f-invoiceNo') && !f.invoiceNo) return bad('invoiceNo', 'اكتب رقم الفاتورة');
  if (!f.name) return bad('name', 'اكتب اسم العميل');
  if (!f.customerNo) return bad('customerNo', 'اكتب رقم العميل — وإذا ما عندك رقمه اكتب: عند (اسم الموظف) أو لايوجد');
  if (/\d{6,}/.test(toLatin(f.customerNo).replace(/[\s-]/g, '')) && !normPhone(f.customerNo)) return bad('customerNo', 'رقم الجوال غير صحيح — لازم يكون 10 أرقام ويبدأ بـ 05');
  if (normPhone(f.customerNo)) f.customerNo = normPhone(f.customerNo);
  if (!(f.amount > 0)) return bad('amount', 'اكتب مبلغ الفاتورة');
  if (!f.invoiceDate) return bad('invoiceDate', 'اختر تاريخ الفاتورة');
  if (f.dueDate && f.dueDate < f.invoiceDate) return bad('dueDate', 'تاريخ الاستحقاق قبل تاريخ الفاتورة');
  return f;
}
function openNewInvoice() {
  S.openId = null;
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><h2>فاتورة جديدة</h2><button class="x" aria-label="إغلاق" onclick="this.closest('dialog').close()">×</button></div>
    <div class="dlg-body">${invoiceForm({}, true)}<div><button class="btn primary" id="n-save">إضافة الفاتورة</button></div></div></div>`;
  dlg.showModal();
  $('#n-save').onclick = e => busy(e.currentTarget, async () => {
    const f = readInvoiceForm(); if (!f) return;
    const id = docId(f.invoiceNo);
    if (S.invoices.some(x => x.id === id)) { toast('رقم الفاتورة موجود مسبقاً', true); return; }
    const paid = round2(num($('#f-paid').value));
    if (paid > f.amount) { toast('المسدد أكبر من مبلغ الفاتورة', true); return; }
    await S.api.createMany([{ id, ...f, paid, notes: $('#f-notes').value.trim(), payments: [] }]);
    logIt('create', f, `إضافة فاتورة ${f.invoiceNo} (${f.name}) بمبلغ ${money(f.amount)} ${CUR}`);
    dlg.close(); toast('تمت إضافة الفاتورة');
  });
}

/* =================== customers (invoices grouped per customer) =================== */
const isOpenDebt = x => x.amount !== null && x.remaining > 0 && x.cat !== 'refund';
function custKey(x) {
  const p = x.ins.cPhone || x.ins.namePhone;
  if (p) return 'p:' + p;
  if (!x.ins.nameUnknown) return 'n:' + normAr(x.name);
  return 'i:' + x.id;
}
function customerGroups() {
  // a name written without a phone joins the customer who has that same name with a phone (if only one does)
  const byName = new Map();

  return [...m].map(([key, list]) => {
    const names = list.filter(x => !x.ins.nameUnknown).map(x => String(x.name).trim());
    const freq = n => names.filter(m => normAr(m) === normAr(n)).length;
    const distinct = [...new Map(names.map(n => [normAr(n), n])).values()].sort((a, b) => freq(b) - freq(a) || b.length - a.length);
    const name = distinct[0] || '', otherNames = distinct.slice(1);
    const open = list.filter(isOpenDebt);
    const oldest = open.reduce((o, x) => (!o || x.days > o.days ? x : o), null);
    const latestFollow = list.filter(x => x.followAt).sort((a, b) => b.followAt - a.followAt)[0];
    return {
      key, list, name, otherNames, open,
      phones: [...new Set(list.flatMap(x => x.ins.phones))],
      remaining: round2(open.reduce((s, x) => s + x.remaining, 0)),
      amount: round2(list.reduce((s, x) => s + (x.amount || 0), 0)),
      paid: round2(list.reduce((s, x) => s + x.paid, 0)),

      promiseDue: list.some(x => x.promiseDue), hold: list.find(x => x.hold)?.hold || '',
      follow: latestFollow ? latestFollow.follow : 'none', review: open.some(x => x.ins.review),
      first: list.map(x => (x.invoiceDate || '9999') + '|' + x.invoiceNo).sort()[0],

}

async function submitCustomerPayment() {

  for (const x of targets) { if (left <= 0.004) break; const a = round2(Math.min(left, x.remaining)); plan.push([x, a]); left = round2(left - a); }

    const done = [];
    for (const [x, a] of plan) {

  });
}

}
async function importContacts(list, fileName) {
  const merged = [...S.contacts.map(c => ({ ...c }))];
  list.forEach(c => { const i = merged.findIndex(m => normAr(m.name) === normAr(c.name)); if (i >= 0) merged[i] = { ...merged[i], ...c, aliases: [...new Set([...(merged[i].aliases || []), ...c.aliases])] }; else merged.push(c); });
  if (!confirm(`إضافة/تحديث ${list.length} من جهات التواصل من ملف ${fileName}؟`)) return;
  await S.api.saveContacts(merged); logIt('edit', null, `استيراد جهات التواصل من ${fileName}`); toast('تم حفظ جهات التواصل');
}

/* =================== Excel import =================== */
const HEADERS = {
  'اسمالعميل': 'name', 'العميل': 'name',
  'رقمالعميل': 'customerNo', 'كودالعميل': 'customerNo',
  'رقمالفاتوره': 'invoiceNo',
  'تاريخالفاتوره': 'invoiceDate',
  'تاريخالاستحقاق': 'dueDate',
  'مبلغالفاتوره': 'amount', 'قيمهالفاتوره': 'amount', 'اجماليالفاتوره': 'amount',
  'المبلغالمسدد': 'paid', 'المسدد': 'paid',
  'المبلغالمتبقي': 'remaining', 'المتبقي': 'remaining',
  'ملاحظات': 'notes', 'الملاحظات': 'notes',
  'المسوول': 'owner', 'الموظفالمسوول': 'owner',
};
const docId = no => String(no).trim().replace(/[\/\\#?\[\]\s]+/g, '-').replace(/^\.+$/, '_') || uid();
const cellText = v => (v == null ? '' : typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(v)) : toLatin(String(v))).trim();
function cellDate(v, XLSX) {
  if (v === '' || v == null) return { ok: true, v: '' };
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) { const p = XLSX.SSF.parse_date_code(v); if (p) return { ok: true, v: `${p.y}-${pad(p.m)}-${pad(p.d)}` }; }
    return { ok: false, v: '' };
  }
  const s = toLatin(String(v)).trim(); let m, y, mo, d;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) [y, mo, d] = [m[1], m[2], m[3]];
  else if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s))) [y, mo, d] = [m[3], m[2], m[1]];
  else return { ok: false, v: '' };
  y = +y; mo = +mo; d = +d;
  if (y < 1990 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > 31) return { ok: false, v: '' };
  return { ok: true, v: `${y}-${pad(mo)}-${pad(d)}` };
}
function parseSheet(aoa, XLSX) {
  let best = { idx: -1, map: {}, n: 0 };
  for (let i = 0; i < Math.min(aoa.length, 20); i++) {
    const map = {}; let n = 0;
    (aoa[i] || []).forEach((h, c) => { const k = HEADERS[normAr(h)]; if (k && !(k in map)) { map[k] = c; n++; } });
    if (n > best.n) best = { idx: i, map, n };
  }
  const res = { docs: [], noNo: 0, dupes: 0, badDates: 0, noAmount: 0, headerRow: best.idx, found: Object.keys(best.map), missing: [] };
  ['name', 'invoiceNo', 'amount'].forEach(k => { if (!(k in best.map)) res.missing.push(k); });
  if (best.n < 3 || res.missing.length) return res;
  const seen = new Set(); const M_ = best.map; const get = (r, k) => (k in M_ ? r[M_[k]] : '');
  for (let i = best.idx + 1; i < aoa.length; i++) {
    const r = aoa[i] || [];
    if (!r.some(v => String(v ?? '').trim() !== '')) continue;
    const invoiceNo = cellText(get(r, 'invoiceNo'));
    if (!invoiceNo) { res.noNo++; continue; }
    let id = docId(invoiceNo);
    if (seen.has(id)) { res.dupes++; let k = 2; while (seen.has(id + '-' + k)) k++; id = id + '-' + k; }
    seen.add(id);
    const id1 = cellDate(get(r, 'invoiceDate'), XLSX), dd = cellDate(get(r, 'dueDate'), XLSX);
    if (!id1.ok || !dd.ok) res.badDates++;
    const amtRaw = get(r, 'amount'), hasAmt = String(amtRaw ?? '').trim() !== '';
    let amount = hasAmt ? round2(num(amtRaw)) : null, paid = round2(num(get(r, 'paid')));
    const remRaw = get(r, 'remaining'), hasRem = String(remRaw ?? '').trim() !== '', rem = round2(num(remRaw));
    if (amount === null && hasRem) amount = round2(paid + rem);
    if (amount === null) res.noAmount++;
    if (!('paid' in M_) && hasRem && amount !== null) paid = round2(amount - rem);
    res.docs.push({ row: i + 1, id, invoiceNo, name: cellText(get(r, 'name')), customerNo: cellText(get(r, 'customerNo')),
      invoiceDate: id1.v, dueDate: dd.v, amount, paid: Math.max(0, paid),
      notes: cellText(get(r, 'notes')), owner: cellText(get(r, 'owner')), payments: [] });
  }
  return res;
}
const FIELD_AR = { name: 'اسم العميل', invoiceNo: 'رقم الفاتورة', amount: 'مبلغ الفاتورة' };
async function importFile(file) {
  const XLSX = await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let res = null, sheet = '';
  for (const n of wb.SheetNames) {
    const c = parseContacts(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }));
    if (c && c.length && wb.SheetNames.length === 1) { await importContacts(c, file.name); return; }
  }
  for (const n of wb.SheetNames) {
    const r = parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }), XLSX);
    if (!res || r.docs.length > res.docs.length) { res = r; sheet = n; }
  }
  if (!res || !res.docs.length) {
    const miss = res?.missing?.length ? 'ما لقيت أعمدة: ' + res.missing.map(k => FIELD_AR[k]).join('، ') : 'ما لقيت فواتير في الملف';
    toast(miss + '. تأكد إن أول صف فيه أسماء الأعمدة.', true); return;
  }
  const existing = new Set(S.invoices.map(x => x.id));
  const fresh = res.docs.filter(d => !existing.has(d.id)), already = res.docs.length - fresh.length;
  const freshD = fresh.map(derive);
  dlg.innerHTML = `<div class="dlg"><div class="dlg-head"><div><h2>استيراد من Excel</h2><div class="sub">${esc(file.name)} · ورقة «${esc(sheet)}»</div></div>
    <button class="x" aria-label="إغلاق" onclick="this.closest('dialog').close()">×</button></div>
    <div class="dlg-body">
      <ul class="stats">
        <li><span>فواتير جديدة بتنضاف</span><b class="num">${fresh.length}</b></li>
        <li><span>موجودة مسبقاً بالموقع (ما بتتغير)</span><b class="num">${already}</b></li>
        ${res.noNo ? `<li><span>صفوف بدون رقم فاتورة (تم تجاهلها)</span><b class="num">${res.noNo}</b></li>` : ''}
        ${res.dupes ? `<li><span>أرقام فواتير مكررة في الملف (انضافت برقم مميز -2)</span><b class="num">${res.dupes}</b></li>` : ''}
        ${res.noAmount ? `<li style="color:var(--warn)"><span>فواتير بدون مبلغ (تنضاف وتقدر تكمّل مبلغها بعدين)</span><b class="num">${res.noAmount}</b></li>` : ''}
        ${res.badDates ? `<li style="color:var(--warn)"><span>صفوف فيها تاريخ ما انقرأ (مثلاً هجري أو نص)</span><b class="num">${res.badDates}</b></li>` : ''}
        <li><span>إجمالي المتبقي للفواتير الجديدة</span><b>${M(freshD.reduce((s, x) => s + Math.max(0, x.remaining), 0))} ${CUR}</b></li>
      </ul>
      <p class="muted" style="margin:0">الأعمدة المحسوبة (المتبقي، حالة السداد، أيام التأخير، فئة التأخير) يحسبها الموقع تلقائياً ولا تُنسخ من الملف.</p>
      ${fresh.length ? `<div class="prev-wrap"><table class="prev"><thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>الاستحقاق</th><th>المبلغ</th><th>المسدد</th><th>المتبقي</th><th>الفئة</th><th>المسؤول</th></tr></thead><tbody>
        ${freshD.slice(0, 8).map(x => `<tr><td class="num">${esc(x.invoiceNo)}</td><td>${esc(x.name)}</td><td>${fmtDate(x.dueDate)}</td><td>${M(x.amount)}</td><td>${M(x.paid)}</td><td>${M(x.remaining)}</td><td>${CAT[x.cat].label}</td><td>${esc(x.owner)}</td></tr>`).join('')}
      </tbody></table></div>${fresh.length > 8 ? `<p class="muted" style="margin:0">+ <span class="num">${fresh.length - 8}</span> فاتورة ثانية</p>` : ''}` : ''}
      ${fresh.length ? `<div class="grid2" style="padding:0"><div class="field full" style="margin-bottom:-4px"><label>صفوف «الملف القديم» في الإكسل (اختياري)</label></div>
        <div class="field"><label for="i-oldFrom">من صف</label><input id="i-oldFrom" type="text" inputmode="numeric" dir="ltr"></div>
        <div class="field"><label for="i-oldTo">إلى صف</label><input id="i-oldTo" type="text" inputmode="numeric" dir="ltr"></div></div>` : ''}
      <div class="rowbtns"><button class="btn primary" id="i-go" ${fresh.length ? '' : 'disabled'}>إضافة ${fresh.length} فاتورة</button><button class="btn" onclick="this.closest('dialog').close()">إلغاء</button></div>
    </div></div>`;
  S.openId = null; dlg.showModal();
  $('#i-go').onclick = e => busy(e.currentTarget, async () => {
    const a = parseInt(toLatin($('#i-oldFrom').value)), b = parseInt(toLatin($('#i-oldTo').value));
    if ((a || b) && !(a > 0 && b >= a)) { toast('اكتب صفوف الملف القديم صح (من صف … إلى صف …)', true); return; }
    fresh.forEach(d => { d.oldFile = !!(a && d.row >= a && d.row <= b); d.follow = 'none'; });
    await S.api.createMany(fresh);
    const nOld = fresh.filter(d => d.oldFile).length;
    logIt('import', null, `استيراد ${fresh.length} فاتورة من ملف ${file.name}${nOld ? ` (منها ${nOld} من الملف القديم)` : ''}`);
    dlg.close(); toast(`تمت إضافة ${fresh.length} فاتورة`);
  });
}

/* =================== Excel export =================== */
async function exportXlsx() {
  const XLSX = await loadXlsx();
  const head = ['اسم العميل', 'رقم العميل', 'رقم الفاتورة', 'تاريخ الفاتورة', 'تاريخ الاستحقاق', 'مبلغ الفاتورة', 'المبلغ المسدد', 'المبلغ المتبقي', 'حالة السداد', 'أساس حساب التأخير', 'أيام التأخير', 'فئة التأخير', 'ملاحظات', 'المسؤول', 'النوع', 'جوال العميل', 'اسأل', 'تنبيهات', 'حالة المتابعة', 'موعد الوعد', 'من الملف القديم', 'لا تتواصل'];
  const rows = S.invoices.slice().sort(SORTS.name).map(x => [x.name, x.customerNo, x.invoiceNo, x.invoiceDate, x.dueDate || '', x.amount ?? '', x.paid, x.amount === null ? '' : Math.max(0, x.remaining),
    STATUS[x.status], x.basisLabel, x.days || '', CAT[x.cat].label, x.notes || '', x.owner || '', x.ins.kinds.map(k => k.label).join('، '), x.ins.phones.join(' / '), x.ins.ask ? x.ins.ask.name : '', x.ins.alerts.join(' • '), FOL[x.follow].label, x.promiseDate || '', x.oldFile ? 'نعم' : '', x.hold || '']);
  const pays = [];
  S.invoices.forEach(x => x.payments.forEach(p => pays.push([x.invoiceNo, x.name, p.date, num(p.amount), p.note || '', p.by || ''])));
  pays.sort((a, b) => String(b[2]).localeCompare(String(a[2])));
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet([head, ...rows]); ws1['!cols'] = head.map((h, i) => ({ wch: [24, 12, 14, 13, 13, 13, 13, 13, 14, 16, 11, 14, 30, 16, 16, 24, 14, 40, 16, 12, 12, 30][i] }));
  const ws2 = XLSX.utils.aoa_to_sheet([['رقم الفاتورة', 'اسم العميل', 'تاريخ السداد', 'المبلغ', 'ملاحظة', 'سُجّلت بواسطة'], ...pays]); ws2['!cols'] = [14, 24, 13, 12, 26, 26].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, 'الفواتير');
  XLSX.utils.book_append_sheet(wb, ws2, 'الدفعات');
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, `الفواتير-${todayISO()}.xlsx`);
  S.api.saveBackup({ lastExportAt: Date.now(), lastExportBy: S.user.email }).catch(e => console.warn('backup meta', e));
  logIt('export', null, `تصدير نسخة Excel (${S.invoices.length} فاتورة)`);
}

/* =================== boot =================== */
function onSnapErr(e) { console.error(e); toast(errMsg(e), true); }
(async function boot() {
  try { S.api = DEMO ? demoApi() : await firebaseApi(); }
  catch (e) { console.error(e); renderFatal('تعذر تحميل Firebase. تأكد من الإنترنت ومن إعدادات config.js.'); return; }
  S.api.onAuth(async u => {
    S.unsub.forEach(f => { try { f && f(); } catch {} }); S.unsub = [];
    if (dlg.open) dlg.close();
    Object.assign(S, { user: u, role: null, loaded: false, invoices: [], raw: [], contacts: [], log: [], view: 'list', prevSeen: null });
    if (!u) { renderLogin(); return; }
    renderLoading();
    try { S.role = await S.api.getRole(u.email); } catch (e) { console.error(e); S.role = null; }
    if (!S.role) { renderNoAccess(); return; }
    renderShell(); update();
    S.unsub.push(S.api.watchInvoices(list => {
      S.raw = list; S.invoices = list.map(derive); S.loaded = true; update();
      if (S.openId) { if (cur()) renderDetailLive(); else if (dlg.open) dlg.close(); }
      else if (S.openCust && dlg.open) renderCustomerLive();
    }, onSnapErr));
    if (!getSeen()) setSeen(Date.now());   // first time on this device: start counting from now
    let firstLog = true;
    S.unsub.push(S.api.watchLog(list => {
      const known = new Set(S.log.map(l => l.id));
      const fresh = firstLog ? [] : list.filter(l => !known.has(l.id) && l.by !== S.user.email);
      S.log = list; firstLog = false;
      if (fresh.length) toast(fresh.length === 1 ? `تحديث جديد من ${String(fresh[0].by || '').split('@')[0]}: ${fresh[0].text}` : `${fresh.length} تحديثات جديدة`);
      if (S.view === 'log') renderLog(); else renderUnread();
    }, onSnapErr));
    S.unsub.push(S.api.watchBackup(d => { S.backup = d || {}; renderBackupBanner(); if (S.view === 'sum') renderSummary(); }, onSnapErr));
    S.unsub.push(S.api.watchContacts(list => {
      S.contacts = list; S.invoices = S.raw.map(derive); update();
      if (S.openId && cur()) renderDetailLive();
    }, onSnapErr));
  });
})();
